<header class="admin-header">
  <div class="admin-header-inner">
    <!-- Left: Brand -->
    <div class="ah-left">
      <a class="ah-brand" routerLink="/admin/dashboard">
        <div class="ah-brand-icon">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
          </svg>
        </div>
        <span class="ah-brand-text">FOX Admin</span>
      </a>
    </div>

    <!-- Center: Page indicator -->
    <div class="ah-center">
      <span class="ah-page-label">Management Dashboard</span>
    </div>

    <!-- Right: Actions -->
    <div class="ah-right">
      <a class="ah-user" *ngIf="user" routerLink="/admin/profile" title="My Profile">
        <div class="ah-avatar">
          <img *ngIf="user.profilePictureUrl && !avatarImgError" [src]="getImageUrl(user.profilePictureUrl)" alt="" (error)="onAvatarError()">
          <span *ngIf="!user.profilePictureUrl || avatarImgError" class="ah-avatar-initials">{{ getInitials() }}</span>
        </div>
        <div class="ah-user-info">
          <span class="ah-user-name">{{ user.firstName || user.username }}</span>
          <span class="ah-user-role">{{ getRoleLabel() }}</span>
        </div>
      </a>

      <button class="ah-logout" (click)="logout()" title="Logout">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="1.8"/>
          <polyline points="16 17 21 12 16 7" stroke="currentColor" stroke-width="1.8"/>
          <line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="1.8"/>
        </svg>
      </button>
    </div>
  </div>
</header>
