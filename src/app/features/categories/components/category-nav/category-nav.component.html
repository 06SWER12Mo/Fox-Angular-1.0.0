<div class="category-nav">
  <!-- Mobile Toggle -->
  <button class="mobile-toggle" (click)="toggleMobileMenu()" aria-label="Toggle categories">
    <mat-icon>menu</mat-icon>
    <span>Categories</span>
    <mat-icon [class.rotated]="isMobileMenuOpen">arrow_drop_down</mat-icon>
  </button>

  <!-- Categories List -->
  <nav class="categories" [class.mobile-open]="isMobileMenuOpen">
    <!-- All Products -->
    <div class="category-item" [class.active]="!activeCategoryId">
      <a (click)="clearCategory()" class="category-link">
        <mat-icon>apps</mat-icon>
        <span>All Products</span>
      </a>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="loading-categories">
      <mat-spinner diameter="24"></mat-spinner>
    </div>

    <!-- Error State -->
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
      <button mat-button color="primary" (click)="loadCategories()">Retry</button>
    </div>

    <!-- Categories -->
    <div *ngFor="let category of categories" class="category-item" [class.active]="isActive(category.id)">
      <!-- Parent Category -->
      <div class="category-header">
        <a (click)="selectCategory(category.id)" class="category-link">
          <span class="category-icon" *ngIf="category.imageUrl">
            <img [src]="category.imageUrl" [alt]="category.name">
          </span>
          <span class="category-name">{{ category.name }}</span>
          <span class="category-count" *ngIf="getCategoryCount(category) > 0">
            {{ getCategoryCount(category) }}
          </span>
        </a>
        
        <!-- Expand/Collapse Button for Subcategories -->
        <button 
          *ngIf="hasSubCategories(category)"
          class="expand-btn"
          (click)="toggleCategory(category.id)"
          [class.expanded]="isExpanded(category.id)"
        >
          <mat-icon>{{ isExpanded(category.id) ? 'expand_less' : 'expand_more' }}</mat-icon>
        </button>
      </div>

      <!-- Subcategories -->
      <div 
        class="subcategories" 
        *ngIf="hasSubCategories(category)" 
        [class.open]="isExpanded(category.id)"
      >
        <div 
          *ngFor="let sub of category.subCategories" 
          class="subcategory-item"
          [class.active]="isActive(sub.id)"
        >
          <a (click)="selectCategory(sub.id)" class="subcategory-link">
            <span class="subcategory-name">{{ sub.name }}</span>
            <span class="subcategory-count" *ngIf="sub.subCategoryCount > 0">
              {{ sub.subCategoryCount }}
            </span>
          </a>
        </div>
      </div>
    </div>
  </nav>
</div>
