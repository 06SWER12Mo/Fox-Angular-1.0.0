<div class="product-card" [class.out-of-stock]="isOutOfStock()">
  <!-- Image -->
  <div class="product-image">
    <a [routerLink]="['/products', product.id]">
      <img 
        [src]="getImageUrl()" 
        [alt]="product.name"
        loading="lazy"
        (error)="onImageError($event)"
        (load)="onImageLoad()"
        width="100%"
        height="100%"
      >
    </a>
    
    <!-- Discount Badge -->
    <span class="discount-badge" *ngIf="hasDiscount()">
      -{{ getDiscountPercentage() }}%
    </span>

    <!-- Out of Stock Badge -->
    <span class="out-of-stock-badge" *ngIf="isOutOfStock()">
      Out of Stock
    </span>
  </div>

  <!-- Content -->
  <div class="product-card-content">
    <a [routerLink]="['/products', product.id]" class="product-title">
      {{ product.name }}
    </a>
    
    <p class="product-description">{{ product.shortDescription | truncate:60 }}</p>

    <!-- Rating -->
    <div class="product-rating">
      <app-star-rating [rating]="product.averageRating"></app-star-rating>
      <span class="review-count">({{ product.totalReviews }})</span>
    </div>

    <!-- Price -->
    <div class="product-price">
      <span class="current-price">{{ product.price | currency }}</span>
      <span class="original-price" *ngIf="hasDiscount()">
        {{ product.compareAtPrice | currency }}
      </span>
    </div>

    <!-- Add to Cart Button -->
    <button 
      *ngIf="showAddToCart && !isOutOfStock()"
      mat-raised-button 
      color="primary" 
      class="add-to-cart-btn"
      (click)="onAddToCart()"
    >
      Add to Cart
    </button>
  </div>
</div>
