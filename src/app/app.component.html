<!-- ========== CUSTOMER LAYOUT ========== -->
<ng-container *ngIf="!isAdminRoute">
  <app-header></app-header>
  <router-outlet></router-outlet>
  <app-footer></app-footer>

  <!-- Floating Cart Widget -->
  <app-floating-cart></app-floating-cart>

  <!-- Back to Home floating button -->
  <button
    *ngIf="showBackToHome"
    class="back-home-btn"
    routerLink="/"
    [attr.aria-label]="'Back to home page'"
    title="Back to Home"
  >
    <svg viewBox="0 0 24 24" fill="none" class="back-icon">
      <path d="M19 12H5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="back-text">Back Home</span>
  </button>
</ng-container>

<!-- ========== ADMIN LAYOUT ========== -->
<ng-container *ngIf="isAdminRoute">
  <app-admin-header></app-admin-header>
  <router-outlet></router-outlet>
  <app-admin-footer></app-admin-footer>
</ng-container>
