<div class="product-container">
  <div class="product-header">
    <h1>{{ categoryId ? 'Category Products' : 'All Products' }}</h1>
    <div class="search-wrapper">
      <app-product-search (search)="onSearch($event)"></app-product-search>
    </div>
  </div>

  <div class="product-layout">
    <!-- Filters Sidebar -->
    <aside class="product-filters">
      <app-product-filters
        [filterForm]="filterForm"
        [currentSort]="currentSort"
        [sortOptions]="sortOptions"
        [categories]="categories"
        [selectedCategoryId]="selectedCategoryId"
        (sortChange)="onSortChange($event)"
        (categoryChange)="onCategorySelect($event)"
        (clearFilters)="clearFilters()"
      ></app-product-filters>
    </aside>

    <!-- Product Grid -->
    <main class="product-grid">
      <!-- Loading: animated skeleton cards -->
      <div *ngIf="isLoading" class="skeleton-grid">
        <div class="skeleton-card" *ngFor="let _ of [].constructor(6); let i = index">
          <div class="skeleton-image" [style.animation-delay]="i * 0.08 + 's'"></div>
          <div class="skeleton-content">
            <div class="skeleton-line skeleton-category" [style.animation-delay]="i * 0.08 + 's'"></div>
            <div class="skeleton-line skeleton-title" [style.animation-delay]="i * 0.08 + 's'"></div>
            <div class="skeleton-line skeleton-rating" [style.animation-delay]="i * 0.08 + 's'"></div>
            <div class="skeleton-footer">
              <div class="skeleton-line skeleton-price" [style.animation-delay]="i * 0.08 + 's'"></div>
              <div class="skeleton-btn" [style.animation-delay]="i * 0.08 + 's'"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Error -->
      <div *ngIf="errorMessage && !isLoading" class="error-state">
        <div class="error-icon">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 8v4M12 16h0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <p class="error-text">{{ errorMessage }}</p>
        <button class="btn btn-accent" (click)="loadProducts()">
          <svg viewBox="0 0 24 24" fill="none" width="16" height="16">
            <path d="M1 4v6h6M23 20v-6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Retry
        </button>
      </div>

      <!-- Empty State -->
      <div *ngIf="!isLoading && !errorMessage && products.length === 0" class="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/>
            <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M8 11h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <h2 class="empty-title">No Products Found</h2>
        <p class="empty-text">Try adjusting your filters or search terms to discover what you're looking for.</p>
        <button class="btn btn-accent" (click)="clearFilters()">
          <svg viewBox="0 0 24 24" fill="none" width="16" height="16">
            <path d="M4 6h16M6 12h12M9 18h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Clear Filters
        </button>
      </div>

      <!-- Products -->
      <div *ngIf="!isLoading && !errorMessage && products.length > 0" class="products-grid">
        <app-product-card
          *ngFor="let product of products"
          [product]="product"
          (addToCart)="addToCart($event)"
        ></app-product-card>
      </div>

      <!-- Pagination -->
      <div *ngIf="!isLoading && !errorMessage && products.length > 0" class="pagination-container">
        <app-pagination
          [currentPage]="currentPage"
          [totalPages]="Math.ceil(totalElements / pageSize)"
          [pageSize]="pageSize"
          [totalElements]="totalElements"
          [pageSizeOptions]="[10, 20, 50]"
          (pageChange)="onPageChange({ pageIndex: $event, pageSize: pageSize })"
          (pageSizeChange)="onPageChange({ pageIndex: 0, pageSize: $event })"
        ></app-pagination>
      </div>
    </main>
  </div>
</div>
