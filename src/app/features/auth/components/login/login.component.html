<div class="login-container">
  <!-- Decorative background elements -->
  <div class="login-bg-decoration">
    <div class="deco-circle deco-circle--1"></div>
    <div class="deco-circle deco-circle--2"></div>
    <div class="deco-circle deco-circle--3"></div>
    <div class="deco-line deco-line--h"></div>
    <div class="deco-line deco-line--v"></div>
  </div>

  <div class="login-card">
    <!-- Brand mark -->
    <div class="brand-mark">
      <span class="brand-icon">✦</span>
    </div>

    <!-- Header -->
    <div class="login-header">
      <h1>Welcome back</h1>
      <p>Sign in to your account to continue shopping</p>
    </div>

    <!-- Error message -->
    <div class="error-message" *ngIf="errorMessage" [class.auth-failed]="loginFailed">
      <span class="error-icon">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M12 8v4M12 16h0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <span class="error-text">
        <strong *ngIf="loginFailed">Sign in failed</strong>
        <strong *ngIf="!loginFailed">Something went wrong</strong>
        <span>{{ errorMessage }}</span>
      </span>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Username/Email Field -->
      <div class="form-field" [class.has-error]="(submitted && f['usernameOrEmail'].errors) || loginFailed">
        <label class="form-label" for="usernameOrEmail">Username or Email</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.8"/>
          </svg>
          <input
            id="usernameOrEmail"
            type="text"
            formControlName="usernameOrEmail"
            placeholder="Enter your email or username"
            class="form-input"
            autocomplete="username"
            (input)="loginFailed = false"
          >
        </div>
        <div class="field-error" *ngIf="submitted && f['usernameOrEmail'].errors?.['required']">
          Username or email is required
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-field" [class.has-error]="(submitted && f['password'].errors) || loginFailed">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <input
            id="password"
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            placeholder="Enter your password"
            class="form-input"
            autocomplete="current-password"
            (input)="loginFailed = false"
          >
          <button
            type="button"
            class="password-toggle"
            (click)="hidePassword = !hidePassword"
            [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
          >
            <!-- Eye icon (password hidden) -->
            <svg viewBox="0 0 24 24" fill="none" *ngIf="hidePassword" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
            </svg>
            <!-- Eye-off icon (password visible) -->
            <svg viewBox="0 0 24 24" fill="none" *ngIf="!hidePassword" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="field-error" *ngIf="submitted && f['password'].errors?.['required']">
          Password is required
        </div>
        <div class="field-error" *ngIf="submitted && f['password'].errors?.['minlength']">
          Password must be at least 6 characters
        </div>
      </div>

      <!-- Options Row -->
      <div class="login-options">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="rememberMe" class="checkbox-input">
          <span class="checkbox-custom">
            <svg viewBox="0 0 12 12" fill="none" class="check-icon" aria-hidden="true">
              <path d="M2.5 6L5 8.5L9.5 3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="checkbox-text">Remember me</span>
        </label>
        <a routerLink="/auth/forgot-password" class="forgot-link">Forgot password?</a>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="login-btn"
        [disabled]="isLoading"
      >
        <span *ngIf="!isLoading">Sign In</span>
        <span *ngIf="isLoading" class="spinner-wrapper">
          <span class="spinner"></span>
        </span>
      </button>
    </form>

    <!-- Divider -->
    <div class="divider">
      <span class="divider-line"></span>
      <span class="divider-text">New here?</span>
      <span class="divider-line"></span>
    </div>

    <!-- Register Link -->
    <div class="register-link">
      <span>Don't have an account?</span>
      <a routerLink="/auth/register">Create one</a>
    </div>
  </div>
</div>
