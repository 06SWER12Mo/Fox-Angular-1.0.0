<div class="address-selector">
  <!-- No Addresses State -->
  <div *ngIf="addresses.length === 0" class="empty-state">
    <div class="empty-icon">
      <svg viewBox="0 0 24 24" fill="none" width="40" height="40">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12" cy="10" r="3" stroke="currentColor" stroke-width="1.8"/>
      </svg>
    </div>
    <p class="empty-title">No addresses saved yet</p>
    <p class="empty-hint">Add a delivery address so we know where to send your order.</p>
    <button class="btn btn-accent" (click)="addNewAddress()">
      <svg viewBox="0 0 24 24" fill="none" width="16" height="16">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      Add New Address
    </button>
  </div>

  <!-- Address List -->
  <div *ngFor="let address of addresses" 
       class="address-card" 
       [class.selected]="isSelected(address.id)"
       (click)="selectAddress(address.id)">
    
    <!-- Custom Radio -->
    <div class="address-radio">
      <div class="radio-outer" [class.checked]="isSelected(address.id)">
        <div class="radio-inner" *ngIf="isSelected(address.id)"></div>
      </div>
    </div>

    <!-- Details -->
    <div class="address-details">
      <div class="address-header">
        <span class="address-name">{{ address.recipientName || 'Recipient' }}</span>
        <span class="default-badge" *ngIf="address.isDefault">Default</span>
      </div>
      <p class="address-street">{{ address.addressLine1 }}{{ address.street ? ', ' + address.street : '' }}</p>
      <p class="address-town">{{ address.townName }}</p>
      <div class="address-phone">
        <svg viewBox="0 0 24 24" fill="none" width="14" height="14">
          <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>{{ address.recipientPhone || 'No phone' }}</span>
      </div>
    </div>

    <!-- Edit Button -->
    <button class="edit-btn" (click)="$event.stopPropagation(); editAddress(address.id)" aria-label="Edit address">
      <svg viewBox="0 0 24 24" fill="none" width="18" height="18">
        <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <!-- Add Address -->
  <button class="add-btn" (click)="addNewAddress()">
    <svg viewBox="0 0 24 24" fill="none" width="16" height="16">
      <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span>Add New Address</span>
  </button>
</div>
