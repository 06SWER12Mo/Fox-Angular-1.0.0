<div class="filters-card">
  <div class="filters-header">
    <span class="filters-title">
      <svg viewBox="0 0 24 24" fill="none" class="filters-icon">
        <path d="M4 6h16M6 12h12M9 18h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Filters
    </span>
    <span class="active-count" *ngIf="getActiveFiltersCount() > 0">{{ getActiveFiltersCount() }}</span>
  </div>

  <form [formGroup]="filterForm" class="filters-body">
    <!-- Category -->
    <div class="filter-group">
      <label class="group-label">
        <svg viewBox="0 0 24 24" fill="none" width="14" height="14">
          <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        Category
      </label>
      <div class="category-chips">
        <button
          class="category-chip"
          [class.active]="selectedCategoryId === null"
          (click)="onCategorySelect(null)"
        >
          All
        </button>
        <button
          *ngFor="let cat of categories"
          class="category-chip"
          [class.active]="selectedCategoryId === cat.id"
          (click)="onCategorySelect(cat.id)"
        >
          {{ cat.name }}
        </button>
      </div>
    </div>

    <div class="filter-divider"></div>

    <!-- Sort By -->
    <div class="filter-group">
      <label class="group-label">
        <svg viewBox="0 0 24 24" fill="none" width="14" height="14">
          <path d="M3 6h18M6 12h12M9 18h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        Sort By
      </label>
      <div class="sort-chips">
        <button
          *ngFor="let option of sortOptions"
          class="sort-chip"
          [class.active]="currentSort === option.value"
          (click)="onSortChange(option.value)"
        >
          {{ option.label }}
        </button>
      </div>
    </div>

    <div class="filter-divider"></div>

    <!-- Price Range -->
    <div class="filter-group">
      <label class="group-label">
        <svg viewBox="0 0 24 24" fill="none" width="14" height="14">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 6v12M8 10h8M8 14h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        Price Range
      </label>
      <div class="price-sliders">
        <div class="price-field">
          <span class="currency-tag">₪</span>
          <input
            formControlName="minPrice"
            type="number"
            step="0.01"
            min="0"
            placeholder="Min"
            class="price-input"
            [class.has-value]="filterForm.get('minPrice')?.value"
          >
        </div>
        <div class="price-bar">
          <span class="bar-fill" [style.width.%]="getPriceBarWidth()"></span>
        </div>
        <div class="price-field">
          <span class="currency-tag">₪</span>
          <input
            formControlName="maxPrice"
            type="number"
            step="0.01"
            min="0"
            placeholder="Max"
            class="price-input"
            [class.has-value]="filterForm.get('maxPrice')?.value"
          >
        </div>
      </div>
    </div>

    <div class="filter-divider"></div>

    <!-- Availability Toggles -->
    <div class="filter-group">
      <label class="group-label">
        <svg viewBox="0 0 24 24" fill="none" width="14" height="14">
          <rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.8"/>
          <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Availability
      </label>
      <div class="toggles">
        <label class="toggle-row">
          <input type="checkbox" formControlName="inStock" class="toggle-input">
          <span class="toggle-track">
            <span class="toggle-thumb"></span>
          </span>
          <span class="toggle-label">In Stock Only</span>
        </label>
        <label class="toggle-row">
          <input type="checkbox" formControlName="onSale" class="toggle-input">
          <span class="toggle-track">
            <span class="toggle-thumb"></span>
          </span>
          <span class="toggle-label">On Sale</span>
        </label>
      </div>
    </div>

    <!-- Clear Filters -->
    <button
      type="button"
      class="clear-btn"
      [disabled]="!hasActiveFilters()"
      (click)="onClearFilters()"
    >
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Clear Filters
    </button>
  </form>
</div>
