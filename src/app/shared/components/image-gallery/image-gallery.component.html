<div class="image-gallery">
  <!-- Main Image -->
  <div class="main-image">
    <img [src]="getSelectedImageUrl()" alt="Product image" (error)="onImageError(selectedImage)">
  </div>

  <!-- Thumbnails -->
  <div class="thumbnails" *ngIf="thumbnails.length > 1">
    <button 
      *ngFor="let thumb of thumbnails; let i = index"
      class="thumbnail-btn"
      [class.active]="selectedImage === i"
      [class.error]="isThumbnailError(i)"
      (click)="selectImage(i)"
    >
      <img [src]="isThumbnailError(i) ? defaultImage : thumb" alt="Thumbnail {{ i + 1 }}" (error)="onImageError(i)">
    </button>
  </div>
</div>
