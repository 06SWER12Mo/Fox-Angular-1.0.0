<div class="register-container">
  <!-- Decorative background -->
  <div class="register-bg-decoration" aria-hidden="true">
    <div class="deco-ring deco-ring--1"></div>
    <div class="deco-ring deco-ring--2"></div>
  </div>

  <div class="register-card">
    <!-- Brand mark -->
    <div class="brand-mark">
      <span class="brand-icon">✦</span>
    </div>

    <div class="register-header">
      <h1>Create account</h1>
      <p>Join us and start shopping today</p>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="error-message">
      <span class="error-icon">!</span>
      <span>{{ errorMessage }}</span>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="name-row">
        <div class="form-field half-width">
          <label class="form-label" for="firstName">First Name</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.8"/>
            </svg>
            <input id="firstName" type="text" formControlName="firstName" placeholder="John" class="form-input" autocomplete="given-name">
          </div>
        </div>

        <div class="form-field half-width">
          <label class="form-label" for="lastName">Last Name</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.8"/>
            </svg>
            <input id="lastName" type="text" formControlName="lastName" placeholder="Doe" class="form-input" autocomplete="family-name">
          </div>
        </div>
      </div>

      <div class="form-field" [class.has-error]="submitted && registerForm.get('username')?.errors">
        <label class="form-label" for="username">Username</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.8"/>
          </svg>
          <input id="username" type="text" formControlName="username" placeholder="johndoe" class="form-input" autocomplete="username">
        </div>
        <div class="field-error" *ngIf="submitted && registerForm.get('username')?.hasError('required')">Username is required</div>
        <div class="field-error" *ngIf="submitted && registerForm.get('username')?.hasError('minlength')">At least 3 characters</div>
      </div>

      <div class="form-field" [class.has-error]="submitted && registerForm.get('email')?.errors">
        <label class="form-label" for="email">Email</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M22 6l-10 7L2 6" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
          <input id="email" type="email" formControlName="email" placeholder="john@example.com" class="form-input" autocomplete="email">
        </div>
        <div class="field-error" *ngIf="submitted && registerForm.get('email')?.hasError('required')">Email is required</div>
        <div class="field-error" *ngIf="submitted && registerForm.get('email')?.hasError('email')">Please enter a valid email</div>
      </div>

      <div class="form-field">
        <label class="form-label" for="phoneNumber">Phone (optional)</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input id="phoneNumber" type="tel" formControlName="phoneNumber" placeholder="+1 234 567 890" class="form-input" autocomplete="tel">
        </div>
      </div>

      <div class="form-field" [class.has-error]="submitted && registerForm.get('password')?.errors">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <input id="password" [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="Create a password" class="form-input" autocomplete="new-password">
          <button type="button" class="password-toggle" (click)="hidePassword = !hidePassword" [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'">
            <svg viewBox="0 0 24 24" fill="none" *ngIf="hidePassword" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
            </svg>
            <svg viewBox="0 0 24 24" fill="none" *ngIf="!hidePassword" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="field-error" *ngIf="submitted && registerForm.get('password')?.hasError('required')">Password is required</div>
        <div class="field-error" *ngIf="submitted && registerForm.get('password')?.hasError('minlength')">At least 6 characters</div>
      </div>

      <div class="form-field" [class.has-error]="submitted && (registerForm.get('confirmPassword')?.errors || registerForm.hasError('mismatch'))">
        <label class="form-label" for="confirmPassword">Confirm Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <input id="confirmPassword" [type]="hideConfirmPassword ? 'password' : 'text'" formControlName="confirmPassword" placeholder="Re-enter password" class="form-input" autocomplete="new-password">
          <button type="button" class="password-toggle" (click)="hideConfirmPassword = !hideConfirmPassword" [attr.aria-label]="hideConfirmPassword ? 'Show password' : 'Hide password'">
            <svg viewBox="0 0 24 24" fill="none" *ngIf="hideConfirmPassword" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
            </svg>
            <svg viewBox="0 0 24 24" fill="none" *ngIf="!hideConfirmPassword" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="field-error" *ngIf="submitted && registerForm.get('confirmPassword')?.hasError('required')">Please confirm your password</div>
        <div class="field-error" *ngIf="submitted && registerForm.hasError('mismatch')">Passwords do not match</div>
      </div>

      <button type="submit" class="register-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading">Create Account</span>
        <span *ngIf="isLoading" class="spinner-wrapper">
          <span class="spinner"></span>
        </span>
      </button>

      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-text">or</span>
        <span class="divider-line"></span>
      </div>

      <div class="login-link">
        <span>Already have an account?</span>
        <a routerLink="/auth/login">Sign in</a>
      </div>
    </form>
  </div>
</div>
