<form [formGroup]="searchForm" (ngSubmit)="onSubmit()" class="search-form">
  <div class="search-field" [class.focused]="isFocused">
    <svg class="search-field__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
      <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>

    <input
      class="search-field__input"
      type="text"
      formControlName="keyword"
      placeholder="Search by name, description..."
      (focus)="isFocused = true"
      (blur)="isFocused = false"
    />

    <button
      *ngIf="searchForm.get('keyword')?.value"
      type="button"
      class="search-field__clear"
      aria-label="Clear search"
      (click)="clearSearch()"
    >
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <button type="submit" class="search-btn">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
      <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span>Search</span>
  </button>
</form>
